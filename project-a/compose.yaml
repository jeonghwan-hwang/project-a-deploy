services:
  api:
    image: ghcr.io/jeonghwan-hwang/project-a:git-4a0325ee3dcd253cc963f406b745ad655eb6b7e4
    restart: always
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      company.project: project-a
      company.service: api
      company.owner: jeonghwan-hwang
